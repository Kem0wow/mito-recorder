name: build-exe
on: [push, workflow_dispatch]  # a pushed v* tag builds and publishes the GitHub release the app updates from
permissions:
  contents: write  # gh release create

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: pip install --no-deps windows-capture  # its opencv dependency is unused, kept out of the exe
      - run: pytest -q test_recorder.py
      - name: Write Drive key from secret (never committed)
        shell: pwsh
        run: Set-Content -Path drive_key.py -Value "DRIVE_API_KEY = '$env:DRIVE_API_KEY'"
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name MitoRecorder --icon icon.ico --add-data "icon.png;." --add-data "icon.ico;."
          --collect-all av --hidden-import windows_capture --hidden-import pyaudiowpatch
          --exclude-module cv2 --exclude-module PIL --exclude-module faster_whisper
          recorder.py
      - name: Selftest the built exe (capture + raw input + encode + zip)
        shell: pwsh
        run: |
          $p = Start-Process dist\MitoRecorder.exe -ArgumentList "--selftest","st","--seconds","4" -Wait -PassThru
          Get-Content "$env:USERPROFILE\MitoRecorder.log"
          exit $p.ExitCode
      - name: UI smoke test (window builds, Raw Input starts)
        shell: pwsh
        run: |
          $p = Start-Process dist\MitoRecorder.exe -ArgumentList "--uitest" -Wait -PassThru
          Get-Content "$env:USERPROFILE\MitoRecorder.log" -Tail 3
          exit $p.ExitCode
      - name: Self-update test (a copy of the exe updates itself from the latest release)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $p = Start-Process dist\MitoRecorder.exe -ArgumentList "--updatetest","upd" -Wait -PassThru
          Get-Content "$env:USERPROFILE\MitoRecorder.log" -Tail 12
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: MitoRecorder
          path: dist/MitoRecorder.exe
      - name: Publish release (v* tags only; tag must match VERSION in recorder.py)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver=$(python -c "import re;print(re.search(r'^VERSION = \"(.+)\"', open('recorder.py', encoding='utf-8').read(), re.M).group(1))")
          [ "$tag" = "v$ver" ] || { echo "tag $tag != VERSION $ver"; exit 1; }
          git tag -l --format='%(contents)' "$tag" > notes.md
          [ -s notes.md ] || git log -1 --pretty=%B > notes.md
          gh release create "$tag" dist/MitoRecorder.exe --title "Mito Recorder $tag" --notes-file notes.md
